<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Admin Bakım Tanımı V5.4.19</title>
<link rel="preconnect" href="https://script.google.com" crossorigin>
<link rel="dns-prefetch" href="https://script.google.com">
<link rel="preconnect" href="https://script.googleusercontent.com" crossorigin>
<link rel="preconnect" href="https://lh3.googleusercontent.com" crossorigin>
<link rel="stylesheet" href="style.css">
<link rel="stylesheet" href="mobil-tasma-duzeltme.css">
<style>
.admin-header{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:9px 13px;background:#0f4c81;color:#fff;max-width:100%}
.admin-identity{display:flex;align-items:center;gap:10px;min-width:0;overflow:hidden}
.admin-identity img{height:28px;width:auto;background:#fff;border-radius:6px;padding:3px 5px;flex:none}
.admin-identity div{min-width:0;overflow:hidden}
.admin-identity strong{display:block;font-size:15px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.admin-identity small{opacity:.8;font-size:11px}
.admin-menu{display:flex;gap:8px;flex:0 0 auto}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
@media(max-width:600px){.grid2{grid-template-columns:1fr;gap:0}}
.checkline{display:flex;align-items:center;gap:9px;margin:12px 0}
.checkline input{width:auto;margin:0;flex:none}
.checkline label{margin:0}
#preview{max-width:190px;border:1px solid #dce5ef;border-radius:10px;margin-top:9px}
.template-row .info b{display:block;font-size:15px;overflow-wrap:anywhere}
.template-row .info small{display:block;color:#64748b;overflow-wrap:anywhere}
.template-row .actions svg{width:19px;height:19px;fill:currentColor}
.btn-del{background:#b11f2e}
.btn-del:hover{background:#8f1824}
.edit-mode{border:2px solid #0f4c81;border-radius:12px;padding:12px;background:#f7fafd}
</style>
</head>
<body>
<header class="admin-header">
  <div class="admin-identity"><img src="AKGLOG.png" alt="AKG"><div><strong>Admin Bakım Tanımı</strong><small>V5.4.19</small></div></div>
  <nav class="admin-menu">
    <button id="homeBtn" class="icon-button" type="button" title="Ana Menü" aria-label="Ana Menü"><svg viewBox="0 0 24 24"><path d="M3 11.5 12 4l9 7.5v8a1.5 1.5 0 0 1-1.5 1.5H15v-6H9v6H4.5A1.5 1.5 0 0 1 3 19.5z"/></svg></button>
    <button id="logoutBtn" class="icon-button exit-button" type="button" title="Çıkış" aria-label="Çıkış"><svg viewBox="0 0 24 24"><path d="M10 4H5v16h5v-2H7V6h3zm8.6 7-3.3-3.3 1.4-1.4L22.4 12l-5.7 5.7-1.4-1.4 3.3-3.3H10v-2z"/></svg></button>
  </nav>
</header>

<main>
<section class="card">
  <h1 id="formTitle">Yeni Bakım Tanımı</h1>
  <form id="form">
    <label for="machineSelect">Makine</label>
    <select id="machineSelect"><option value="">Makine seçiniz</option></select>
    <div class="grid2">
      <div><label for="region">Bölge</label><input id="region" placeholder="Bölge" required></div>
      <div><label for="system">Sistem</label><input id="system" placeholder="Sistem" required></div>
    </div>
    <div class="grid2">
      <div><label for="part">Parça</label><input id="part" placeholder="Parça"></div>
      <div><label for="targetValue">İstenen Değer</label><input id="targetValue" placeholder="İstenen değer"></div>
    </div>
    <label for="task">Yapılacak Bakım</label>
    <textarea id="task" placeholder="Yapılacak bakım" required></textarea>
    <div class="grid2">
      <div><label for="orderNo">Sıra No</label><input id="orderNo" type="number" min="1" value="1"></div>
      <div><label for="referenceFile">Referans Resim</label><input id="referenceFile" type="file" accept="image/*"></div>
    </div>
    <img id="preview" class="hidden" alt="Önizleme">
    <div class="checkline"><input id="photoRequired" type="checkbox"><label for="photoRequired">Operatörden kanıt fotoğrafı istensin</label></div>
    <div class="checkline"><input id="active" type="checkbox" checked><label for="active">Aktif</label></div>
    <button id="submitBtn" type="submit">Bakım Tanımını Kaydet</button>
    <button id="cancelEditBtn" class="secondary hidden" type="button">Düzenlemeyi İptal Et</button>
  </form>
  <div id="msg"></div>
</section>

<section class="card">
  <h2>Kayıtlı Bakım Tanımları</h2>
  <button id="refreshBtn" class="secondary">Listeyi Yenile</button>
  <button id="testBtn" class="secondary">Bağlantıyı Test Et</button>
  <div id="machineGroups"></div>
  <pre id="debug"></pre>
</section>
</main>

<div id="adminLoader" class="overlay"><div class="modal"><img src="AKGLOG.png" alt="AKG"><h2 id="adminLoadTitle">Sistem yükleniyor</h2><p id="adminLoadText">Hazırlanıyor...</p><div class="track"><div id="adminBar"></div></div><b id="adminPercent">0%</b><button id="adminRetryBtn" class="hidden">Tekrar Dene</button></div></div>

<iframe name="adminFrame" class="hide" title="Kayıt"></iframe>
<form id="adminPostForm" target="adminFrame" method="post" class="hide"><input name="action" value="createMaintenanceTemplateWithImage"><input name="payload" id="adminPayload"><input name="imageBase64" id="adminBase64"><input name="imageName" id="adminImageName"><input name="imageType" id="adminImageType"></form>

<script src="net.js"></script>
<script>
'use strict';
/* Admin Bakım Tanımı Paneli V5.4.19 */
const API_URL = CMMS.API_URL, SESSION = CMMS.SESSION, $ = id => document.getElementById(id);
let machines = [], templates = [], editingId = null, pendingSave = null, pendingTimer = null;

function esc(v){ return String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
function jp(action,p={},o){ return CMMS.call(action,p,o); }
function msg(text, cls){ $('msg').textContent = text || ''; $('msg').className = cls || ''; }
function adminLoading(p, t){
  $('adminLoader').classList.remove('hide');
  $('adminBar').style.width = p + '%';
  $('adminPercent').textContent = p + '%';
  $('adminLoadText').textContent = t;
}
function closeAdminLoader(){ $('adminLoader').classList.add('hide'); }

function guard(){
  let user = null;
  try{ user = JSON.parse(sessionStorage.getItem(SESSION) || 'null'); }catch(e){}
  if(!user){ location.replace('index.html'); return false; }
  if(!String(user.role || '').toLocaleLowerCase('tr').includes('admin')){
    alert('Bu ekran için yönetici yetkisi gereklidir.');
    location.replace('weekly-maintenance.html');
    return false;
  }
  return true;
}

async function initializeAdminScreen(){
  $('adminRetryBtn').classList.add('hidden');
  $('adminLoadTitle').textContent = 'Sistem yükleniyor';
  $('adminPercent').textContent = '0%';
  $('adminBar').style.width = '0%';
  $('adminBar').classList.remove('load-error');
  try{
    adminLoading(20, 'Makine listesi ve bakımlar aynı anda yükleniyor...');
    const [mRes, lRes] = await Promise.allSettled([loadMachines(), list()]);
    if(mRes.status === 'rejected') throw mRes.reason;
    if(lRes.status === 'rejected') throw lRes.reason;
    adminLoading(100, 'Sistem hazır.');
    closeAdminLoader();
  }catch(error){
    $('adminLoadTitle').textContent = 'Sistem yüklenemedi';
    $('adminLoadText').textContent = 'Bağlantı hatası: ' + (error.message || error);
    $('adminPercent').textContent = 'Hata';
    $('adminBar').style.width = '100%';
    $('adminBar').classList.add('load-error');
    $('adminRetryBtn').classList.remove('hidden');
  }
}

function fillMachineSelect(r){
  machines = r.machines || [];
  $('machineSelect').innerHTML = '<option value="">Makine seçiniz</option>' +
    machines.map(x => `<option value="${esc(x.id)}">${esc(x.machineName)} | ${esc(x.costCenter||'')}</option>`).join('');
  msg((r.count ?? machines.length) + ' makine yüklendi.', 'success');
}
async function loadMachines(force){
  try{
    const r = force ? await jp('listMachinesCached')
      : await CMMS.cachedCall('listMachinesCached', {}, { ttl:900000, onFresh:f=>fillMachineSelect(f) });
    if(!r.success) throw Error(r.message);
    fillMachineSelect(r);
    return r;
  }catch(e){ msg('Makine listesi yüklenemedi: ' + e.message, 'error'); throw e; }
}

async function list(force){
  try{
    const r = force ? await jp('listMaintenanceTemplatesCached')
      : await CMMS.cachedCall('listMaintenanceTemplatesCached', {}, { ttl:300000, onFresh:f=>render(f.templates||[]) });
    if(!r.success) throw Error(r.message);
    $('debug').textContent = JSON.stringify(r, null, 2);
    render(r.templates || []);
    return r;
  }catch(e){
    msg('Bakım listesi yüklenemedi: ' + e.message, 'error');
    $('machineGroups').innerHTML = '<div class="empty-state error">Liste yüklenemedi: ' + esc(e.message) + '</div>';
    throw e;
  }
}

function render(items){
  templates = items || [];
  if(!templates.length){
    $('machineGroups').innerHTML = '<div class="empty-state">Kayıtlı bakım tanımı yok.</div>';
    return;
  }
  const groups = {};
  templates.forEach(t => {
    const key = t.machineName || t.machineId;
    if(!groups[key]) groups[key] = [];
    groups[key].push(t);
  });
  $('machineGroups').innerHTML = Object.keys(groups).sort((a,b)=>a.localeCompare(b,'tr')).map(name => {
    const rows = groups[name].sort((a,b)=>(a.orderNo||1)-(b.orderNo||1)).map(t => `<div class="template-row">
        ${t.referenceImageUrl ? `<img class="reference-image" loading="lazy" decoding="async" src="${esc(t.referenceImageUrl)}" alt="Referans">` : ''}
        <div class="info">
          <b>${esc(t.orderNo||1)}. ${esc(t.task)}</b>
          <small>${esc(t.region)} / ${esc(t.system)}${t.part ? ' / ' + esc(t.part) : ''}</small>
          <small>İstenen: ${esc(t.targetValue||'-')} | Fotoğraf: ${t.photoRequired?'Zorunlu':'İsteğe bağlı'} | ${t.active?'Aktif':'Pasif'}</small>
        </div>
        <div class="actions">
          <button type="button" class="btn-edit" data-id="${esc(t.templateId)}" title="Düzenle" aria-label="Düzenle"><svg viewBox="0 0 24 24"><path d="M3 17.25V21h3.75L17.8 9.94l-3.75-3.75zM20.7 7.04a1 1 0 0 0 0-1.41l-2.34-2.34a1 1 0 0 0-1.41 0l-1.83 1.83 3.75 3.75z"/></svg></button>
          <button type="button" class="btn-del" data-id="${esc(t.templateId)}" title="Sil" aria-label="Sil"><svg viewBox="0 0 24 24"><path d="M6 19a2 2 0 0 0 2 2h8a2 2 0 0 0 2-2V7H6zM19 4h-3.5l-1-1h-5l-1 1H5v2h14z"/></svg></button>
        </div>
      </div>`).join('');
    return `<div class="machine-group"><div class="machine-group-title">${esc(name)}</div>${rows}</div>`;
  }).join('');
  document.querySelectorAll('.btn-edit').forEach(b => b.onclick = () => startEdit(b.dataset.id));
  document.querySelectorAll('.btn-del').forEach(b => b.onclick = () => removeTemplate(b.dataset.id));
}

function resetFields(){
  $('form').reset();
  $('active').checked = true;
  $('orderNo').value = 1;
  $('preview').classList.add('hidden');
  $('preview').removeAttribute('src');
}
function cancelEdit(){
  editingId = null;
  $('formTitle').textContent = 'Yeni Bakım Tanımı';
  $('submitBtn').textContent = 'Bakım Tanımını Kaydet';
  $('cancelEditBtn').classList.add('hidden');
  $('form').classList.remove('edit-mode');
  resetFields();
}
function startEdit(id){
  const t = templates.find(x => x.templateId === id);
  if(!t) return;
  editingId = id;
  $('formTitle').textContent = 'Bakım Tanımını Düzenle';
  $('submitBtn').textContent = 'Değişiklikleri Kaydet';
  $('cancelEditBtn').classList.remove('hidden');
  $('form').classList.add('edit-mode');
  $('machineSelect').value = t.machineId;
  $('region').value = t.region || '';
  $('system').value = t.system || '';
  $('part').value = t.part || '';
  $('task').value = t.task || '';
  $('targetValue').value = t.targetValue || '';
  $('orderNo').value = t.orderNo || 1;
  $('photoRequired').checked = Boolean(t.photoRequired);
  $('active').checked = Boolean(t.active);
  $('referenceFile').value = '';
  if(t.referenceImageUrl){ $('preview').src = t.referenceImageUrl; $('preview').classList.remove('hidden'); }
  else $('preview').classList.add('hidden');
  window.scrollTo(0,0);
}

function compress(f){
  return new Promise((ok,no)=>{
    if(!f) return ok('');
    const reader = new FileReader(), img = new Image();
    reader.onerror = no;
    reader.onload = e => { img.src = e.target.result; };
    img.onerror = () => ok(String(reader.result).split(',')[1]);
    img.onload = () => {
      try{
        const max = 1400, scale = Math.min(1, max / Math.max(img.width, img.height));
        const c = document.createElement('canvas');
        c.width = Math.round(img.width * scale);
        c.height = Math.round(img.height * scale);
        c.getContext('2d').drawImage(img, 0, 0, c.width, c.height);
        ok(c.toDataURL('image/jpeg', 0.78).split(',')[1]);
      }catch(err){ ok(String(reader.result).split(',')[1]); }
    };
    reader.readAsDataURL(f);
  });
}

function payload(){
  return {
    templateId: editingId || '',
    machineId: $('machineSelect').value,
    region: $('region').value.trim(),
    system: $('system').value.trim(),
    part: $('part').value.trim(),
    task: $('task').value.trim(),
    targetValue: $('targetValue').value.trim(),
    orderNo: Number($('orderNo').value) || 1,
    photoRequired: $('photoRequired').checked,
    active: $('active').checked
  };
}

async function save(e){
  e.preventDefault();
  if(pendingSave) return;
  const data = payload();
  if(!data.machineId) return msg('Makine seçiniz.', 'error');
  if(!data.region || !data.system || !data.task) return msg('Bölge, sistem ve bakım alanları zorunludur.', 'error');
  const file = $('referenceFile').files[0];

  if(editingId && !file){
    try{
      $('submitBtn').disabled = true;
      msg('Güncelleniyor...', '');
      const r = await jp('updateMaintenanceTemplate', { payload: JSON.stringify(data) });
      if(!r.success) throw Error(r.message);
      msg('Bakım tanımı güncellendi.', 'success');
      cancelEdit();
      CMMS.cacheClear();
      await list(true);
    }catch(err){ msg(err.message, 'error'); }
    finally{ $('submitBtn').disabled = false; }
    return;
  }

  if(!file && !editingId) return msg('Referans resim zorunludur.', 'error');

  try{
    $('submitBtn').disabled = true;
    msg('Resim hazırlanıyor...', '');
    const b64 = await compress(file);
    msg('Gönderiliyor...', '');
    pendingSave = { at: Date.now() };
    $('adminPostForm').action = API_URL;
    $('adminPayload').value = JSON.stringify(data);
    $('adminBase64').value = b64;
    $('adminImageName').value = file ? file.name.replace(/[^a-zA-Z0-9._-]/g,'_') : '';
    $('adminImageType').value = file ? 'image/jpeg' : '';
    $('adminPostForm').submit();
    pendingTimer = setTimeout(() => {
      if(pendingSave){
        pendingSave = null;
        $('submitBtn').disabled = false;
        msg('Kayıt yanıtı alınamadı. Listeyi yenileyip kontrol edin.', 'error');
      }
    }, 25000);
  }catch(err){
    pendingSave = null;
    $('submitBtn').disabled = false;
    msg(err.message, 'error');
  }
}

window.addEventListener('message', e => {
  if(!e.data || e.data.source !== 'CMMS_APPS_SCRIPT') return;
  clearTimeout(pendingTimer);
  $('submitBtn').disabled = false;
  pendingSave = null;
  if(e.data.success){
    msg('Bakım tanımı kaydedildi.', 'success');
    cancelEdit();
    CMMS.cacheClear();
    list(true);
  }else{
    msg(e.data.message || 'Kayıt başarısız.', 'error');
  }
});

async function removeTemplate(id){
  const t = templates.find(x => x.templateId === id);
  if(!confirm('Bu bakım tanımı silinecek:\n\n' + (t ? t.task : id) + '\n\nOnaylıyor musunuz?')) return;
  try{
    const r = await jp('deleteMaintenanceTemplate', { templateId: id });
    if(!r.success) throw Error(r.message);
    msg('Bakım tanımı silindi.', 'success');
    CMMS.cacheClear();
    await list(true);
  }catch(e){ msg(e.message, 'error'); }
}

$('cancelEditBtn').onclick = cancelEdit;
$('referenceFile').onchange = e => {
  const f = e.target.files[0];
  if(f){ $('preview').src = URL.createObjectURL(f); $('preview').classList.remove('hidden'); }
};
$('form').onsubmit = save;
$('refreshBtn').onclick = () => { CMMS.cacheClear(); list(true); };
$('testBtn').onclick = async () => {
  const t0 = performance.now();
  try{
    const r = await jp('health', {}, { retries:0 });
    $('debug').textContent = JSON.stringify(r, null, 2);
    msg('Bağlantı başarılı: ' + r.version + ' (' + Math.round(performance.now()-t0) + ' ms)', 'success');
  }catch(e){ msg(e.message, 'error'); }
};
$('homeBtn').onclick = () => location.replace('index.html?screen=home');
$('logoutBtn').onclick = () => {
  if(!confirm('Sistemden çıkmak istiyor musunuz?')) return;
  sessionStorage.removeItem(SESSION);
  CMMS.cacheClear();
  location.replace('index.html');
};
$('adminRetryBtn').onclick = initializeAdminScreen;

if(guard()){ CMMS.warmUp(); initializeAdminScreen(); }
</script>
</body></html>
