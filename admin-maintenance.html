<!doctype html><html lang="tr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Admin V5.4.6</title><link rel="stylesheet" href="style.css"></head><body><header><img src="AKGLOG.png"><b>Admin Bakım Tanımı</b><button onclick="location.href='index.html'">Ana Sayfa</button></header><main><section class="card"><h1>Yeni Haftalık Bakım</h1><select id="machine"></select><input id="region" placeholder="Makine Bölgesi"><input id="system" placeholder="Makine Sistemi"><input id="part" placeholder="Kullanılacak Parça"><input id="target" placeholder="İstenen Değer"><textarea id="task" placeholder="Yapılacak Bakım"></textarea><label><input id="photoReq" type="checkbox"> Kanıt fotoğrafı zorunlu</label><input id="image" type="file" accept="image/*"><button id="save">Bakımı Kaydet</button><div id="msg"></div></section><section class="card"><h2>Kayıtlı Bakımlar</h2><div id="list"></div></section></main><iframe name="uploadFrame" class="hide"></iframe><form id="upload" target="uploadFrame" method="post" class="hide"><input name="action" value="createMaintenanceTemplateWithImage"><input name="payload" id="payload"><input name="imageBase64" id="base64"><input name="imageName" id="name"><input name="imageType" id="type"></form><script>
const API_URL='https://script.google.com/macros/s/AKfycbwjECihD-JQg6ITpewj4ga3HzMraB4sUNhrCf40l6Fjlf2EOhIY9oMknFHAnG_XTCPP/exec',$=id=>document.getElementById(id);let machines=[];function jp(a,p={}){return new Promise((ok,no)=>{const cb='a'+Date.now(),s=document.createElement('script');window[cb]=r=>{delete window[cb];s.remove();ok(r)};s.onerror=()=>no(Error('Bağlantı hatası'));s.src=API_URL+'?'+new URLSearchParams({action:a,callback:cb,...p});document.head.appendChild(s)})}function comp(f){return new Promise((ok,no)=>{const r=new FileReader();r.onload=e=>ok(String(e.target.result).split(',')[1]);r.onerror=no;r.readAsDataURL(f)})}async function load(){const [m,t]=await Promise.all([jp('listMachinesCached'),jp('listMaintenanceTemplatesCached')]);machines=m.machines||[];$('machine').innerHTML='<option value="">Makine seçin</option>'+machines.map(x=>`<option value="${x.id}">${x.machineName}</option>`).join('');$('list').innerHTML=(t.templates||[]).map(x=>`<details><summary>${x.machineName} - ${x.task}</summary><p>${x.region} / ${x.system}</p><button onclick="del('${x.templateId}')">Sil</button></details>`).join('')}async function save(){const f=$('image').files[0];if(!$('machine').value||!$('region').value||!$('system').value||!$('task').value||!f)return $('msg').textContent='Zorunlu alanları doldurun.';const p={machineId:$('machine').value,region:$('region').value,system:$('system').value,part:$('part').value,targetValue:$('target').value,task:$('task').value,orderNo:1,photoRequired:$('photoReq').checked,active:true};$('upload').action=API_URL;$('payload').value=JSON.stringify(p);$('base64').value=await comp(f);$('name').value=f.name;$('type').value=f.type;$('upload').submit();$('msg').textContent='Kayıt gönderildi.';setTimeout(load,1800)}async function del(id){if(confirm('Silinsin mi?')){await jp('deleteMaintenanceTemplate',{templateId:id});load()}}window.addEventListener('message',e=>{if(e.data&&e.data.source==='CMMS_APPS_SCRIPT'){$('msg').textContent=e.data.success?'✅ Kaydedildi':e.data.message;load()}});$('save').onclick=save;load();
</script></body></html>
