<!doctype html><html lang="tr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Admin V5.4.12</title><link rel="stylesheet" href="style.css"></head><body><header><img src="AKGLOG.png"><b>Admin Bakım Yönetimi</b><button class="header-home" onclick="location.href='index.html'">Ana Sayfa</button></header><main><section class="card"><h1>Yeni Haftalık Bakım Hazırla</h1></section><form id="form" class="card admin-grid"><input id="editingId" type="hidden"><label class="full">Makine Seç<select id="machine" required></select></label><label>Makine ID<input id="machineId" readonly></label><label>Makine Adı<input id="machineName" readonly></label><label class="full">Maliyet Merkezi<input id="costCenter" readonly></label><label>Makine Bölgesi<input id="region" required></label><label>Makine Sistemi<input id="system" required></label><label>Kullanılacak Parça<input id="part"></label><label>İstenen Değer<input id="target"></label><label class="full">Yapılacak Bakım<textarea id="task" required></textarea></label><label>Sıra No<input id="order" type="number" min="1" value="1"></label><label class="check"><input id="photoRequired" type="checkbox"> Kanıt fotoğrafı zorunlu</label><label id="imageLabel" class="full">Referans Resim<input id="image" type="file" accept="image/*" required></label><img id="preview" class="reference full hide"><div class="form-actions full"><button id="saveBtn" type="submit">Resmi Yükle ve Bakımı Kaydet</button><button id="cancelEdit" class="secondary hide" type="button">Düzenlemeyi İptal Et</button><button id="test" class="secondary" type="button">Bağlantıyı Test Et</button></div><div id="msg" class="full"></div></form><section class="card"><div class="admin-list-head"><h2>Kayıtlı Bakımlar</h2><button id="refresh" class="secondary compact">Listeyi Yenile</button></div><div id="list">Yükleniyor...</div></section><details class="card"><summary>Bağlantı ayrıntıları</summary><pre id="debug"></pre></details></main><iframe name="uploadFrame" class="hide"></iframe><form id="upload" target="uploadFrame" method="post" class="hide"><input name="action" value="createMaintenanceTemplateWithImage"><input name="payload" id="payload"><input name="imageBase64" id="base64"><input name="imageName" id="imageName"><input name="imageType" id="imageType"></form><script>
'use strict';const API_URL='https://script.google.com/macros/s/AKfycbwjECihD-JQg6ITpewj4ga3HzMraB4sUNhrCf40l6Fjlf2EOhIY9oMknFHAnG_XTCPP/exec',$=id=>document.getElementById(id);let machines=[],templates=[],pending=null,poll=null,polls=0;const pencil='<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 17.25V21h3.75L17.81 9.94l-3.75-3.75L3 17.25zm17.71-10.04a1 1 0 0 0 0-1.42l-2.5-2.5a1 1 0 0 0-1.42 0l-1.96 1.96 3.75 3.75 2.13-1.79z"/></svg>',trash='<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 19a2 2 0 0 0 2 2h8a2 2 0 0 0 2-2V7H6v12zm3.5-9h1.5v8H9.5v-8zm3.5 0h1.5v8H13v-8zM15.5 4l-1-1h-5l-1 1H5v2h14V4z"/></svg>';function jp(a,p={}){return new Promise((ok,no)=>{const cb='a'+Date.now()+Math.random().toString(16).slice(2),s=document.createElement('script');window[cb]=r=>{delete window[cb];s.remove();ok(r)};s.onerror=()=>no(Error('Bağlantı hatası'));s.src=API_URL+'?'+new URLSearchParams({action:a,callback:cb,_:Date.now(),...p});document.head.appendChild(s)})}function esc(v){return String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}function message(t,c=''){$('msg').textContent=t;$('msg').className=c}async function loadMachines(){const r=await jp('listMachinesCached');machines=r.machines||[];$('machine').innerHTML='<option value="">Makine seçiniz</option>'+machines.map(x=>`<option value="${esc(x.id)}">${esc(x.machineName)}</option>`).join('')}function selectMachine(){const m=machines.find(x=>x.id===$('machine').value);$('machineId').value=m?.id||'';$('machineName').value=m?.machineName||'';$('costCenter').value=m?.costCenter||''}function compress(f){return new Promise((ok,no)=>{const r=new FileReader();r.onload=e=>ok(String(e.target.result).split(',')[1]);r.onerror=no;r.readAsDataURL(f)})}function finish(r){if(!pending)return;clearInterval(poll);poll=null;$('saveBtn').disabled=false;$('saveBtn').textContent='Resmi Yükle ve Bakımı Kaydet';message('✅ Bakım kaydedildi'+(r.templateId?' - '+r.templateId:''),'success');pending=null;resetForm();loadList()}function fail(t){clearInterval(poll);poll=null;$('saveBtn').disabled=false;message(t,'error');pending=null}async function verify(){if(!pending)return;const r=await jp('listMaintenanceTemplates',{machineId:pending.machineId,_:Date.now()});const found=(r.templates||[]).find(x=>x.task===pending.task&&x.region===pending.region&&x.system===pending.system);if(found)finish(found)}async function save(e){e.preventDefault();if($('editingId').value)return update();if(pending)return;const file=$('image').files[0],d=formData();if(!d.machineId||!d.region||!d.system||!d.task||!file)return message('Zorunlu alanları doldurun.','error');pending={...d};$('saveBtn').disabled=true;message('Kayıt gönderiliyor...');$('upload').action=API_URL;$('payload').value=JSON.stringify(d);$('base64').value=await compress(file);$('imageName').value=file.name.replace(/[^a-zA-Z0-9._-]/g,'_');$('imageType').value='image/jpeg';$('upload').submit();setTimeout(verify,1500);poll=setInterval(()=>{polls++;verify();if(polls>=12&&pending)fail('Kayıt doğrulanamadı.')},1800)}function formData(){return{machineId:$('machineId').value,region:$('region').value.trim(),system:$('system').value.trim(),part:$('part').value.trim(),task:$('task').value.trim(),targetValue:$('target').value.trim(),orderNo:Number($('order').value||1),photoRequired:$('photoRequired').checked,active:true}}window.addEventListener('message',e=>{if(!e.data||!pending)return;if(!['CMMS_APPS_SCRIPT','CMMS_APPS_SCRIPT_RESULT'].includes(String(e.data.source||'')))return;e.data.success?finish(e.data):fail(e.data.message||'Kayıt başarısız')});function group(items){return items.reduce((a,x)=>{const k=x.machineId||x.machineName;(a[k]||(a[k]={name:x.machineName,items:[]})).items.push(x);return a},{})}async function loadList(){const r=await jp('listMaintenanceTemplatesCached',{_:Date.now()});templates=r.templates||[];const gs=Object.values(group(templates));$('list').innerHTML=gs.map(g=>`<details class="admin-group"><summary><b>${esc(g.name)}</b><span>${g.items.length} bakım</span></summary><div class="admin-items">${g.items.sort((a,b)=>(a.orderNo||1)-(b.orderNo||1)).map(x=>`<article class="admin-item"><div class="admin-item-copy"><strong>${x.orderNo||1}. ${esc(x.task)}</strong><small>${esc(x.region)} / ${esc(x.system)}</small><div class="icon-actions"><button class="icon-btn edit" title="Düzenle" aria-label="Düzenle" onclick="editItem('${esc(x.templateId)}')">${pencil}</button><button class="icon-btn delete" title="Sil" aria-label="Sil" onclick="removeItem('${esc(x.templateId)}')">${trash}</button></div></div><div class="thumb-box">${x.referenceImageUrl?`<img src="${esc(x.referenceImageUrl)}" alt="Referans resim" loading="lazy">`:'<span>Resim yok</span>'}</div></article>`).join('')}</div></details>`).join('')||'Kayıt yok'}function editItem(id){const x=templates.find(t=>t.templateId===id);if(!x)return;$('editingId').value=id;$('machine').value=x.machineId;selectMachine();$('region').value=x.region||'';$('system').value=x.system||'';$('part').value=x.part||'';$('task').value=x.task||'';$('target').value=x.targetValue||'';$('order').value=x.orderNo||1;$('photoRequired').checked=!!x.photoRequired;$('image').required=false;$('imageLabel').classList.add('hide');$('saveBtn').textContent='Bakım Tanımını Güncelle';$('cancelEdit').classList.remove('hide');scrollTo({top:0,behavior:'smooth'})}async function update(){const d=formData();d.templateId=$('editingId').value;const r=await jp('updateMaintenanceTemplate',{payload:JSON.stringify(d)});if(!r.success)return message(r.message,'error');message('✅ Bakım güncellendi','success');resetForm();loadList()}async function removeItem(id){if(!confirm('Bu bakım tanımı silinsin mi?'))return;const r=await jp('deleteMaintenanceTemplate',{templateId:id});if(r.success)loadList();else message(r.message,'error')}function resetForm(){$('form').reset();$('editingId').value='';$('image').required=true;$('imageLabel').classList.remove('hide');$('saveBtn').textContent='Resmi Yükle ve Bakımı Kaydet';$('saveBtn').disabled=false;$('cancelEdit').classList.add('hide');$('preview').classList.add('hide')}$('machine').onchange=selectMachine;$('image').onchange=e=>{const f=e.target.files[0];if(f){$('preview').src=URL.createObjectURL(f);$('preview').classList.remove('hide')}};$('form').onsubmit=save;$('cancelEdit').onclick=resetForm;$('refresh').onclick=loadList;$('test').onclick=async()=>{const r=await jp('health');$('debug').textContent=JSON.stringify(r,null,2);message('Bağlantı başarılı: '+r.version,'success')};loadMachines();loadList();
</script></body></html>
