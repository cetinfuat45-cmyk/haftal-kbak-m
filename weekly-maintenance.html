<!doctype html><html lang="tr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Haftalık Bakım V5.3</title><link rel="stylesheet" href="style.css"></head><body><header class="topbar"><img src="AKGLOG.png"><div class="title"><strong>Haftalık Bakım</strong><small>V5.3.5 Referans Resimli Kontrol Listesi</small></div><button class="ghost" onclick="location.href='index.html'">Ana Sayfa</button></header><main class="page active"><section class="card"><h1>Makine Bakım Listesi</h1><label>Makine Seç<select id="machineSelect"><option value="">Yükleniyor...</option></select></label><div id="msg" class="message"></div></section><section id="tasks"></section><details class="card"><summary>Bağlantı ayrıntıları</summary><pre id="debug"></pre></details></main><script>
const API_URL='https://script.google.com/macros/s/AKfycbwjECihD-JQg6ITpewj4ga3HzMraB4sUNhrCf40l6Fjlf2EOhIY9oMknFHAnG_XTCPP/exec',$=id=>document.getElementById(id);function jp(action,p={}){return new Promise((ok,no)=>{const cb='op_'+Date.now()+Math.floor(Math.random()*9999),s=document.createElement('script');let d=false,c=()=>{delete window[cb];s.remove()},t=setTimeout(()=>{if(!d){d=true;c();no(Error('Bağlantı zaman aşımı'))}},15000);window[cb]=r=>{if(!d){d=true;clearTimeout(t);c();ok(r)}};s.onerror=()=>no(Error('Bağlantı kurulamadı'));s.src=API_URL+'?'+new URLSearchParams({action,callback:cb,_:Date.now(),...p});document.head.appendChild(s)})}function esc(v){return String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}async function machines(){try{const r=await jp('listMachines');$('machineSelect').innerHTML='<option value="">Makine seçiniz</option>'+r.machines.map(x=>`<option value="${esc(x.id)}">${esc(x.machineName)} | ${esc(x.costCenter)}</option>`).join('')}catch(e){$('msg').textContent=e.message}}function driveId(x){if(x.referenceImageDriveId)return String(x.referenceImageDriveId).trim();const u=String(x.referenceImageUrl||'');const m=u.match(/[?&]id=([^&]+)/)||u.match(/\/d\/([^/]+)/);return m?m[1]:''}function refUrl(x){const id=driveId(x);return id?'https://drive.google.com/thumbnail?id='+encodeURIComponent(id)+'&sz=w1600':String(x.referenceImageUrl||'')}function refFallback(img){const id=img.dataset.driveId||'',step=Number(img.dataset.step||0);if(id&&step===0){img.dataset.step='1';img.src='https://lh3.googleusercontent.com/d/'+encodeURIComponent(id)+'=w1600';return}if(id&&step===1){img.dataset.step='2';img.src='https://drive.google.com/uc?export=view&id='+encodeURIComponent(id);return}img.onerror=null;img.classList.add('hidden');img.nextElementSibling.classList.remove('hidden')}async function tasks(){const id=$('machineSelect').value;if(!id){$('tasks').innerHTML='';return}try{const r=await jp('listMaintenanceTemplates',{machineId:id});$('debug').textContent=JSON.stringify(r,null,2);$('tasks').innerHTML=r.templates.filter(x=>x.active).map(x=>{const did=driveId(x),src=refUrl(x);return`<article class="task-card"><h2>${esc(x.task)}</h2><p><b>${esc(x.region)} / ${esc(x.system)}</b></p><div class="operator-reference">${src?`<img src="${esc(src)}" data-drive-id="${esc(did)}" data-step="0" onerror="refFallback(this)" alt="Bakım noktası referans resmi"><div class="image-error hidden">Referans resim açılamadı. Drive paylaşımını kontrol edin.</div>`:'<div class="image-error">Referans resim yok.</div>'}</div><p><b>İstenen değer:</b> ${esc(x.targetValue||'-')}</p><p><span class="badge ${x.photoRequired?'yes':''}">${x.photoRequired?'Kanıt fotoğrafı zorunlu':'Kanıt fotoğrafı isteğe bağlı'}</span></p></article>`}).join('')||'<div class="card">Bu makine için aktif bakım tanımı yok.</div>'}catch(e){$('msg').textContent=e.message}}$('machineSelect').onchange=tasks;machines();
</script></body></html>
