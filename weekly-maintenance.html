<!doctype html><html lang="tr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>OP Paneli V5.4.10</title><link rel="stylesheet" href="style.css"><script src="https://unpkg.com/html5-qrcode" defer></script></head><body><header class="op-header"><div class="identity"><img src="AKGLOG.png"><strong id="opName">OPERATÖR</strong></div><div class="icons"><button id="homeBtn" title="Ana Menü">⌂</button><button id="exitBtn" title="Çıkış">⇥</button></div></header><main><section id="machines" class="card"><h1>Bakımı Yapılacak Makineler</h1><input id="search" placeholder="Makine adı ile ara"><div id="machineList"></div></section><section id="qr" class="card hide"><button onclick="show('machines')">← Geri</button><h2 id="qrTitle"></h2><div id="reader"></div><input id="manual" placeholder="Manuel Makine ID"><button id="verifyBtn">Doğrula</button><div id="qrMsg"></div></section><section id="tasks" class="card hide"><button onclick="show('machines')">← Makineler</button><h2 id="taskTitle"></h2><div id="taskList"></div></section><section id="control" class="card hide"><button onclick="show('tasks')">← Bakımlar</button><h2 id="controlTitle"></h2><img id="ref" class="reference hide"><select id="result"><option value="">Sonuç seçin</option><option>UYGUN</option><option>RED</option></select><textarea id="desc" placeholder="Açıklama"></textarea><input id="proof" type="file" accept="image/*" capture="environment"><button id="saveBtn">Kontrolü Kaydet</button><div id="saveMsg"></div></section></main><iframe name="frame" class="hide"></iframe><form id="post" target="frame" method="post" class="hide"><input name="action" value="saveMaintenanceResultWithImage"><input name="payload" id="payload"><input name="imageBase64" id="b64"><input name="imageName" id="imgName"><input name="imageType" id="imgType"></form><script>
'use strict';const API_URL='https://script.google.com/macros/s/AKfycbwjECihD-JQg6ITpewj4ga3HzMraB4sUNhrCf40l6Fjlf2EOhIY9oMknFHAnG_XTCPP/exec',SESSION='haftalikBakimV544User',$=id=>document.getElementById(id);let machines=[],filtered=[],groups={},records=[],machine=null,tasks=[],task=null,qr=null,pending=null,current='machines';function jp(a,p={}){return new Promise((ok,no)=>{const cb='o'+Date.now()+Math.random().toString(16).slice(2),s=document.createElement('script');window[cb]=r=>{delete window[cb];s.remove();ok(r)};s.onerror=()=>no(Error('Bağlantı hatası'));s.src=API_URL+'?'+new URLSearchParams({action:a,callback:cb,_:Date.now(),...p});document.head.appendChild(s)})}function esc(v){return String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}function user(){try{return JSON.parse(sessionStorage.getItem(SESSION)||'{}')}catch(e){return{}}}function short(n){const p=String(n||'').trim().split(/\s+/).filter(Boolean);return p.length>1?(p[0][0]+'.'+p.at(-1)).toLocaleUpperCase('tr'):p[0]||'OPERATÖR'}function show(id){current=id;['machines','qr','tasks','control'].forEach(x=>$(x).classList.toggle('hide',x!==id))}function day(){return new Date().toISOString().slice(0,10)}
function progress(m){const ts=(groups[m.id]||[]).filter(x=>x.active),rs=records.filter(r=>String(r.machineId)===String(m.id)&&(!r.weekKey||r.weekKey===day())),by={};rs.forEach(r=>{if(r.templateId)by[r.templateId]=r});let i=0;return ts.map(t=>{const r=by[t.templateId]||rs[i++]||null;if(!r)return'pending';return String(r.result||'').toUpperCase()==='RED'?'problem':'done'})}function render(){machineList.innerHTML=filtered.map(m=>{const seg=progress(m).map((x,i)=>`<span class="seg-item" title="${i+1}. bakım"><span class="seg-number">${i+1}</span><span class="seg ${x}"></span></span>`).join('');return`<button class="machine" data-id="${esc(m.id)}"><b>${esc(m.machineName)}</b><span class="bar">${seg}</span></button>`}).join('')||'Kayıt yok';document.querySelectorAll('.machine').forEach(b=>b.onclick=()=>select(b.dataset.id))}async function init(){opName.textContent=short(user().operator);const [b,r]=await Promise.all([jp('getWeeklyBootstrap'),jp('listMaintenanceRecords')]);machines=b.machines||[];filtered=machines;groups=b.templatesByMachine||{};records=r.records||[];render()}async function select(id){machine=machines.find(x=>x.id===id);qrTitle.textContent=machine.machineName;show('qr');if(window.Html5Qrcode)try{qr=new Html5Qrcode('reader');await qr.start({facingMode:'environment'},{fps:10,qrbox:230},verify,()=>{})}catch(e){qrMsg.textContent='Kamera açılamadı. Manuel ID kullanın.'}}function key(v){return String(v||'').toLocaleUpperCase('tr').normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/[^A-Z0-9]/g,'')}async function verify(v){if(key(v)!==key(machine.id))return qrMsg.textContent='Hatalı makine etiketi';if(qr)try{await qr.stop();qr.clear()}catch(e){}tasks=(groups[machine.id]||[]).filter(x=>x.active);taskTitle.textContent=machine.machineName;taskList.innerHTML=tasks.map(t=>`<button class="task" data-id="${t.templateId}">${esc(t.task)}</button>`).join('');document.querySelectorAll('.task').forEach(b=>b.onclick=()=>openTask(b.dataset.id));show('tasks')}function openTask(id){task=tasks.find(x=>x.templateId===id);controlTitle.textContent=task.task;if(task.referenceImageUrl){ref.src=task.referenceImageUrl;ref.classList.remove('hide')}else ref.classList.add('hide');result.value='';proof.value='';show('control')}function compress(f){return new Promise((ok,no)=>{if(!f)return ok('');const r=new FileReader();r.onload=e=>ok(String(e.target.result).split(',')[1]);r.onerror=no;r.readAsDataURL(f)})}async function save(){const file=proof.files[0];if(!result.value)return saveMsg.textContent='Sonuç seçin';if(task.photoRequired&&!file)return saveMsg.textContent='Fotoğraf zorunlu';const req='REQ-'+Date.now(),u=user();pending=req;saveBtn.disabled=true;const pl={clientRequestId:req,templateId:task.templateId,machineId:machine.id,machineName:machine.machineName,operator:u.operator||'',result:result.value,description:desc.value,weekKey:day()};post.action=API_URL;payload.value=JSON.stringify(pl);b64.value=await compress(file);imgName.value=file?file.name:'';imgType.value=file?'image/jpeg':'';post.submit()}function done(r){if(!pending)return;records.push({recordId:r.recordId,clientRequestId:pending,templateId:task.templateId,machineId:machine.id,result:result.value,weekKey:day()});pending=null;saveBtn.disabled=false;saveMsg.textContent='✅ Kaydedildi';render();setTimeout(()=>show('tasks'),700)}window.addEventListener('message',e=>{if(e.data&&e.data.source==='CMMS_APPS_SCRIPT_RESULT')e.data.success?done(e.data):(saveMsg.textContent=e.data.message)});search.oninput=e=>{const q=e.target.value.toLocaleLowerCase('tr');filtered=machines.filter(x=>x.machineName.toLocaleLowerCase('tr').includes(q));render()};verifyBtn.onclick=()=>verify(manual.value);saveBtn.onclick=save;homeBtn.onclick=()=>{if(current!=='machines'&&!confirm('Ana menüye dönerseniz QR tekrar okutulacaktır. Devam edilsin mi?'))return;show('machines')};exitBtn.onclick=()=>{if(confirm('Çıkış yapılsın mı?')){sessionStorage.removeItem(SESSION);location.href='index.html'}};init();
</script></body></html>
