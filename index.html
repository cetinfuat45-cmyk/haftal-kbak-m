<!doctype html>
<html lang="tr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <title>Haftalık Bakım CMMS V5.4.21</title>
  <link rel="preconnect" href="https://script.google.com" crossorigin>
  <link rel="dns-prefetch" href="https://script.google.com">
  <link rel="preconnect" href="https://script.googleusercontent.com" crossorigin>
  <link rel="preconnect" href="https://lh3.googleusercontent.com" crossorigin>
  <link rel="stylesheet" href="style.css">
  <link rel="stylesheet" href="mobil-tasma-duzeltme.css">
  <link rel="preload" href="AKGLOG.png" as="image">
  <link rel="prefetch" href="weekly-maintenance.html">
  <link rel="prefetch" href="red-list.html">
  <style>
  /* ===== Üst menü RED düğmesi ===== */
  .ust-menu{display:flex;align-items:center;gap:8px;flex:0 0 auto}
  .ust-btn{width:42px;height:42px;margin:0;padding:0;display:grid;place-items:center;
           background:#ffffff22;border:1px solid #ffffff44;border-radius:11px;
           cursor:pointer;position:relative}
  .ust-btn svg{width:23px;height:23px;fill:#fff}
  .ust-btn:hover{background:#ffffff33}
  .ust-btn.red-button{background:#FF9999;border-color:#ffffff55}
  .ust-btn.red-button svg{fill:#7a1414}
  .ust-btn.red-button:hover{background:#ff8080}
  .ust-btn.exit-button{border-color:#ffb0b0aa}
  .ust-btn.exit-button:hover{background:#b11f2e}
  .red-badge{position:absolute;top:-6px;right:-6px;min-width:20px;height:20px;padding:0 5px;
             display:none;place-items:center;border-radius:99px;background:#b11f2e;color:#fff;
             font-size:11px;font-weight:900;line-height:1;border:2px solid #0f4c81}
  .red-badge.goster{display:grid}
  .ust-baslik{display:flex;align-items:center;gap:10px;min-width:0;overflow:hidden}
  .ust-baslik img{height:28px;width:auto;background:#fff;border-radius:6px;padding:3px 5px;flex:none}
  .ust-baslik strong{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;
                     font-size:15px;letter-spacing:.3px}
  @media(max-width:600px){.ust-btn{width:40px;height:40px}.ust-menu{gap:6px}}
  @media(max-width:380px){.ust-btn{width:37px;height:37px}
                          .ust-btn svg{width:20px;height:20px}
                          .ust-baslik strong{font-size:13px}}
  </style>
</head>
<body>

<header class="op-header">
  <div class="ust-baslik">
    <img src="AKGLOG.png" alt="AKG">
    <strong>Haftalık Bakım CMMS</strong>
  </div>
  <nav class="ust-menu hide" id="headerMenu">
    <button id="redBtn" class="ust-btn red-button" type="button" title="RED Verilen Bakımlar" aria-label="RED Verilen Bakımlar">
      <svg viewBox="0 0 24 24"><path d="M12 2 1 21h22zm0 5 7.5 12.9h-15zM11 10h2v5h-2zm0 6.5h2v2h-2z"/></svg>
      <span id="redBadge" class="red-badge"></span>
    </button>
    <button id="exitBtn" class="ust-btn exit-button" type="button" title="Çıkış" aria-label="Çıkış">
      <svg viewBox="0 0 24 24"><path d="M10 4H5v16h5v-2H7V6h3zm8.6 7-3.3-3.3 1.4-1.4L22.4 12l-5.7 5.7-1.4-1.4 3.3-3.3H10v-2z"/></svg>
    </button>
  </nav>
</header>

<main>
<section id="login" class="card">
  <img class="logo" src="AKGLOG.png" alt="AKG">
  <h1>Şifre Girişi</h1>
  <p class="muted">Kullanıcılar Google E-Tablo içindeki <b>veri</b> sayfasından doğrulanır.</p>
  <input id="password" type="password" inputmode="numeric" placeholder="Şifre" autocomplete="current-password">
  <button id="loginBtn">Giriş Yap</button>
  <button id="testBtn" class="secondary">Bağlantıyı Test Et</button>
  <div id="msg"></div>
  <pre id="debug"></pre>
</section>

<section id="home" class="card hide">
  <h2 id="welcome"></h2>
  <p class="muted">RED verilen bakımlara üst menüdeki kırmızı uyarı düğmesinden ulaşabilirsiniz.</p>
  <button id="opBtn">Operatör Bakım Paneli</button>
  <button id="adminBtn" class="secondary hide">Admin Paneli</button>
</section>
</main>

<div id="loader" class="overlay hide"><div class="modal"><img src="AKGLOG.png" alt="Yükleniyor"><h2 id="loadTitle">Sistem yükleniyor</h2><p id="loadText">Hazırlanıyor...</p><div class="track"><div id="bar"></div></div><b id="percent">0%</b></div></div>

<script src="net.js"></script>
<script>
'use strict';
/* =====================================================================
   Haftalık Bakım CMMS - Giriş ve Ana Menü
   Sürüm: V5.4.21

   RED Verilen Bakımlar düğmesi üst menüdedir.
   Düğmenin üzerinde bu haftaki RED sayısı rozet olarak gösterilir.

   Not: Bu sayfa app.js dosyasını çağırmaz.
   ===================================================================== */

const SESSION = CMMS.SESSION, $ = id => document.getElementById(id);
const ROZET_KEY = 'cmmsRedSayisi_V5421';

CMMS.warmUp();

function loading(p, t, n = '') {
  $('loader').classList.remove('hide');
  $('bar').style.width = p + '%';
  $('percent').textContent = p + '%';
  $('loadText').textContent = t;
  $('loadTitle').textContent = (n ? n + ' için ' : '') + 'sistem yükleniyor';
}

function haftaAnahtari(tarih) {
  if (CMMS.weekKey) return CMMS.weekKey(tarih);
  const d = new Date(tarih || new Date());
  d.setHours(0, 0, 0, 0);
  d.setDate(d.getDate() + 4 - (d.getDay() || 7));
  const y0 = new Date(d.getFullYear(), 0, 1);
  const w = Math.ceil((((d - y0) / 86400000) + 1) / 7);
  return d.getFullYear() + '-W' + String(w).padStart(2, '0');
}

/* ---------- RED rozeti ---------- */
function rozetOku() {
  try {
    const box = JSON.parse(localStorage.getItem(ROZET_KEY) || 'null');
    if (box && box.week === haftaAnahtari()) return box.sayi;
  } catch (e) {}
  return null;
}
function rozetYaz(sayi) {
  try {
    localStorage.setItem(ROZET_KEY, JSON.stringify({ week: haftaAnahtari(), sayi: sayi }));
  } catch (e) {}
}
function rozetGoster(sayi) {
  const el = $('redBadge');
  if (!el) return;
  if (sayi && sayi > 0) {
    el.textContent = sayi > 99 ? '99+' : String(sayi);
    el.classList.add('goster');
    $('redBtn').title = 'RED Verilen Bakımlar (' + sayi + ')';
  } else {
    el.classList.remove('goster');
    $('redBtn').title = 'RED Verilen Bakımlar';
  }
}

function tarihCevir(v) {
  if (v instanceof Date) return v;
  const raw = String(v || '').trim();
  if (!raw) return new Date(NaN);
  const m = raw.match(/^(\d{1,2})[.\/](\d{1,2})[.\/](\d{4})/);
  if (m) return new Date(+m[3], +m[2] - 1, +m[1]);
  return new Date(raw);
}

function haftaNormalle(weekKey, createdAt) {
  const raw = String(weekKey || '').trim();
  if (/^\d{4}-W\d{2}$/i.test(raw)) return raw.toUpperCase();
  if (raw) {
    const d = tarihCevir(raw);
    if (!isNaN(d.getTime())) return haftaAnahtari(d);
  }
  const c = tarihCevir(createdAt);
  if (!isNaN(c.getTime())) return haftaAnahtari(c);
  return '';
}

function rozetTazele() {
  CMMS.call('listMaintenanceRecords', {}, { retries: 0, timeout: 20000 })
    .then(function (r) {
      if (!r || !r.success) return;
      const buHafta = haftaAnahtari();
      const sayi = (r.records || []).filter(function (x) {
        if (String(x.result || '').toLocaleUpperCase('tr').indexOf('RED') === -1) return false;
        return haftaNormalle(x.weekKey, x.createdAt) === buHafta;
      }).length;
      rozetYaz(sayi);
      rozetGoster(sayi);
    })
    .catch(function () { /* rozet isteğe bağlıdır */ });
}

function showHome(user) {
  const userName = user.operator || user.name || user.fullName || 'Kullanıcı';
  const admin = String(user.role || '').toLocaleLowerCase('tr').includes('admin');
  $('loader').classList.add('hide');
  $('login').classList.add('hide');
  $('home').classList.remove('hide');
  $('welcome').textContent = 'Hoş geldiniz, ' + userName;
  $('headerMenu').classList.remove('hide');
  $('adminBtn').classList.toggle('hide', !admin);
  const onbellek = rozetOku();
  if (onbellek !== null) rozetGoster(onbellek);
  rozetTazele();
}

async function login() {
  const password = $('password').value.trim();
  if (!password) return $('msg').textContent = 'Şifre girin.';
  $('loginBtn').disabled = true;
  $('msg').textContent = '';
  loading(10, 'Google Apps Script bağlantısı kuruluyor...');
  const bootstrapPromise = CMMS.call('getWeeklyBootstrap', {}, { retries: 0 })
    .then(r => { if (r && r.success) CMMS.cacheWrite('getWeeklyBootstrap', r); return r; })
    .catch(() => null);
  try {
    const r = await CMMS.call('login', { password });
    $('debug').textContent = JSON.stringify(r, null, 2);
    if (!r.success) throw Error(r.message);
    const userName = r.user.operator || r.user.name || r.user.fullName || 'Kullanıcı';
    loading(55, 'Kullanıcı doğrulandı.', userName);
    sessionStorage.setItem(SESSION, JSON.stringify(r.user));
    loading(85, 'Bakım listesi hazırlanıyor...', userName);
    await bootstrapPromise;
    loading(100, 'Sistem hazır.', userName);
    showHome(r.user);
  } catch (e) {
    $('loader').classList.add('hide');
    $('msg').textContent = e.message;
  } finally {
    $('loginBtn').disabled = false;
  }
}

$('loginBtn').onclick = login;
$('password').onkeydown = e => { if (e.key === 'Enter') login(); };
$('testBtn').onclick = async () => {
  const t0 = performance.now();
  try {
    const r = await CMMS.call('health', {}, { retries: 0 });
    $('debug').textContent = JSON.stringify(r, null, 2);
    $('msg').textContent = 'Bağlantı başarılı: ' + r.version +
      ' (' + Math.round(performance.now() - t0) + ' ms)';
  } catch (e) { $('msg').textContent = e.message; }
};
$('opBtn').onclick = () => location.href = 'weekly-maintenance.html';
$('adminBtn').onclick = () => location.href = 'admin-maintenance.html';
$('redBtn').onclick = () => location.href = 'red-list.html';
$('exitBtn').onclick = () => {
  if (!confirm('Sistemden çıkmak istiyor musunuz?')) return;
  sessionStorage.removeItem(SESSION);
  CMMS.cacheClear();
  location.href = 'index.html';
};

(function showHomeFromSession() {
  const raw = sessionStorage.getItem(SESSION);
  if (!raw) return;
  const params = new URLSearchParams(location.search);
  if (params.get('screen') !== 'home') return;
  try { showHome(JSON.parse(raw)); }
  catch (error) { sessionStorage.removeItem(SESSION); }
})();
</script>
</body></html>
