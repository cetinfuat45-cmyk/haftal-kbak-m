<!doctype html><html lang="tr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#0f4c81"><title>Haftalık Bakım CMMS V5.3.6</title><link rel="stylesheet" href="style.css"></head><body>
