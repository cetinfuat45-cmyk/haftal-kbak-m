<!doctype html>
<html lang="tr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Haftalık Bakım CMMS V5.4.8</title>
  
  <link rel="preload" href="style.css" as="style">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header>
    <img src="AKGLOG.png" alt="Logo" loading="lazy" decoding="async" width="40" height="40">
    <b>Haftalık Bakım CMMS</b>
    <button id="logout" class="hide">Çıkış</button>
  </header>

  <main>
    <section id="login" class="card">
      <img class="logo" src="AKGLOG.png" alt="Logo" loading="eager" decoding="async">
      <h1>Şifre Girişi</h1>
      <p>Kullanıcılar Google E-Tablo içindeki <b>veri</b> sayfasından doğrulanır.</p>
      <input id="password" type="password" inputmode="numeric" placeholder="Şifre" autocomplete="current-password">
      <button id="loginBtn">Giriş Yap</button>
      <button id="testBtn" class="secondary">Bağlantıyı Test Et</button>
      <div id="msg"></div>
      <pre id="debug"></pre>
    </section>

    <section id="home" class="card hide">
      <h2 id="welcome"></h2>
      <button id="opBtn">Operatör Bakım Paneli</button>
      <button id="adminBtn" class="secondary">Admin Paneli</button>
    </section>
  </main>

  <div id="loader" class="overlay hide">
    <div class="modal">
      <img src="AKGLOG.png" alt="Yükleniyor" decoding="async">
      <h2 id="loadTitle">Sistem yükleniyor</h2>
      <p id="loadText">Hazırlanıyor...</p>
      <div class="track"><div id="bar"></div></div>
      <b id="percent">0%</b>
    </div>
  </div>

  <!-- Sayfa performansını artırmak için script asenkron yüklenir -->
  <script src="app.js" defer></script>
</body>
</html>
